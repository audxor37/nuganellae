<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .amount-input-cursor::after {
            content: "";
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #3182f6;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
        .ios-safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#d9e4f0",
                        "primary-fixed-dim": "#acc7ff",
                        "primary-container": "#1071e5",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e0e2ec",
                        "outline": "#727785",
                        "on-background": "#181c23",
                        "primary": "#0059b9",
                        "outline-variant": "#c1c6d6",
                        "inverse-on-surface": "#eff0fa",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d8d9e3",
                        "surface-container-highest": "#e0e2ec",
                        "on-primary-container": "#fefcff",
                        "tertiary-fixed": "#e7deff",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ccbdff",
                        "on-secondary-fixed": "#121d25",
                        "tertiary": "#6339db",
                        "surface-container": "#ecedf7",
                        "on-surface-variant": "#414754",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#3d4851",
                        "surface-tint": "#005bbe",
                        "secondary-container": "#d9e4f0",
                        "inverse-primary": "#acc7ff",
                        "on-secondary-container": "#5b6670",
                        "tertiary-container": "#7d56f5",
                        "background": "#f9f9ff",
                        "on-tertiary-fixed": "#1f005f",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary-fixed-variant": "#4d17c5",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#d7e2ff",
                        "on-primary-fixed": "#001a40",
                        "secondary": "#55606a",
                        "surface-container-high": "#e6e8f2",
                        "on-surface": "#181c23",
                        "secondary-fixed-dim": "#bdc8d3",
                        "surface": "#f9f9ff",
                        "inverse-surface": "#2d3038",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed-variant": "#004491",
                        "surface-container-low": "#f2f3fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "card-gap": "12px",
                        "base": "8px",
                        "xl": "32px",
                        "container-padding": "20px",
                        "md": "16px",
                        "xs": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-md-bold": ["Plus Jakarta Sans"],
                        "body-lg-bold": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg-reg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-md-reg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md-bold": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-lg-bold": ["18px", {"lineHeight": "26px", "fontWeight": "700"}],
                        "display-lg": ["36px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-lg-reg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "body-md-reg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface selection:bg-primary-fixed">
<!-- TopAppBar -->
<nav class="flex justify-between items-center px-container-padding h-14 w-full z-50 bg-surface fixed top-0 left-0">
<button class="w-10 h-10 flex items-center justify-start active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-label-md text-label-md text-on-surface-variant">1/3</span>
</div>
<div class="w-10 h-10"></div> <!-- Placeholder for balancing -->
</nav>
<!-- Main Content Canvas -->
<main class="pt-20 px-container-padding flex flex-col min-h-screen">
<!-- Headline Section -->
<header class="mb-10">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">얼마를 나눌까요?</h1>
<p class="font-body-md-reg text-body-md-reg text-on-surface-variant">정산할 총 금액을 입력해 주세요.</p>
</header>
<!-- Amount Input Display -->
<div class="flex-grow flex flex-col">
<div class="relative mb-6">
<div class="flex items-baseline overflow-hidden" id="amountDisplay">
<span class="font-display-lg text-display-lg text-on-surface amount-input-cursor" id="amountValue">0</span>
<span class="font-headline-lg text-headline-lg text-on-surface ml-1">원</span>
</div>
<!-- Hidden input for mobile keyboard accessibility if needed, 
                     but we'll implement a custom numpad feel or just use standard input logic -->
<input class="opacity-0 absolute inset-0 w-full h-full cursor-default" id="hiddenInput" readonly="" type="number"/>
</div>
<!-- Quick Amount Chips -->
<div class="flex flex-wrap gap-2 mb-8">
<button class="px-4 py-2 bg-secondary-container text-on-secondary-container rounded-full font-label-md text-label-md active:scale-95 transition-all" onclick="addAmount(10000)">
                    +1만 원
                </button>
<button class="px-4 py-2 bg-secondary-container text-on-secondary-container rounded-full font-label-md text-label-md active:scale-95 transition-all" onclick="addAmount(50000)">
                    +5만 원
                </button>
<button class="px-4 py-2 bg-secondary-container text-on-secondary-container rounded-full font-label-md text-label-md active:scale-95 transition-all" onclick="addAmount(100000)">
                    +10만 원
                </button>
<button class="px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full font-label-md text-label-md active:scale-95 transition-all" onclick="clearAmount()">
                    초기화
                </button>
</div>
<!-- Visual Decorative Element (Abstract Payment Flow) -->
<div class="mt-auto mb-32 opacity-40">
<div class="w-full h-32 rounded-3xl bg-gradient-to-br from-primary-fixed to-secondary-fixed relative overflow-hidden flex items-center justify-center">
<div class="absolute -top-10 -left-10 w-32 h-32 bg-white/20 rounded-full blur-2xl"></div>
<div class="absolute -bottom-10 -right-10 w-32 h-32 bg-primary-container/10 rounded-full blur-2xl"></div>
<span class="material-symbols-outlined text-primary-container text-6xl" data-icon="payments" style="font-variation-settings: 'wght' 200;">payments</span>
</div>
</div>
</div>
</main>
<!-- Custom Numeric Keypad (Floating over bottom button) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant/10 rounded-t-3xl shadow-[0px_-10px_30px_rgba(0,0,0,0.03)] z-40 pb-2">
<div class="grid grid-cols-3 gap-1 p-2">
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="appendNumber(1)">1</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="appendNumber(2)">2</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="appendNumber(3)">3</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="appendNumber(4)">4</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="appendNumber(5)">5</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="appendNumber(6)">6</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="appendNumber(7)">7</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="appendNumber(8)">8</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="appendNumber(9)">9</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface rounded-xl opacity-30 cursor-not-allowed">.</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="appendNumber(0)">0</button>
<button class="h-14 flex items-center justify-center font-headline-md text-headline-md text-on-surface active:bg-surface-variant/30 rounded-xl transition-colors" onclick="deleteNumber()">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>
</div>
<!-- Bottom Action Button -->
<div class="px-container-padding py-4 ios-safe-bottom">
<button class="w-full h-14 bg-outline-variant text-on-primary font-body-lg-bold text-body-lg-bold rounded-2xl transition-all active:scale-[0.98] disabled:cursor-not-allowed" disabled="" id="nextBtn">
                참여자 입력하기
            </button>
</div>
</div>
<script>
        let currentAmount = 0;
        const amountDisplay = document.getElementById('amountValue');
        const nextBtn = document.getElementById('nextBtn');

        function updateUI() {
            amountDisplay.innerText = currentAmount.toLocaleString();
            
            if (currentAmount > 0) {
                nextBtn.disabled = false;
                nextBtn.classList.remove('bg-outline-variant');
                nextBtn.classList.add('bg-primary-container');
                nextBtn.classList.add('shadow-lg');
                nextBtn.classList.add('shadow-primary-container/20');
            } else {
                nextBtn.disabled = true;
                nextBtn.classList.add('bg-outline-variant');
                nextBtn.classList.remove('bg-primary-container');
                nextBtn.classList.remove('shadow-lg');
            }

            // Simple micro-interaction: subtle scale up on change
            amountDisplay.classList.add('scale-105');
            setTimeout(() => {
                amountDisplay.classList.remove('scale-105');
            }, 100);
        }

        function appendNumber(num) {
            if (currentAmount === 0 && num === 0) return;
            
            const strAmount = currentAmount === 0 ? num.toString() : currentAmount.toString() + num.toString();
            
            // Limit to trillions just in case
            if (strAmount.length > 13) return;
            
            currentAmount = parseInt(strAmount);
            updateUI();
        }

        function deleteNumber() {
            const strAmount = currentAmount.toString();
            if (strAmount.length === 1) {
                currentAmount = 0;
            } else {
                currentAmount = parseInt(strAmount.slice(0, -1));
            }
            updateUI();
        }

        function addAmount(val) {
            currentAmount += val;
            updateUI();
        }

        function clearAmount() {
            currentAmount = 0;
            updateUI();
        }

        // Initialize UI
        updateUI();

        // Prevent rubber banding for better app-like feel
        document.body.addEventListener('touchmove', function(e) {
            if (window.scrollY === 0) {
                // Allows content to be scrolled if it overflows, but stops overall bounce
                // e.preventDefault(); 
            }
        }, { passive: false });
    </script>
</body></html>
