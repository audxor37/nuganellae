<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>누가낼래 - 정산 방식 선택</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .selected-card {
            border: 2px solid #0059b9;
            background-color: #f2f3fd;
        }
        .scroll-hide::-webkit-scrollbar {
            display: none;
        }
        .scroll-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#d9e4f0",
                        "primary-fixed-dim": "#acc7ff",
                        "primary-container": "#1071e5",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e0e2ec",
                        "outline": "#727785",
                        "on-background": "#181c23",
                        "primary": "#0059b9",
                        "outline-variant": "#c1c6d6",
                        "inverse-on-surface": "#eff0fa",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d8d9e3",
                        "surface-container-highest": "#e0e2ec",
                        "on-primary-container": "#fefcff",
                        "tertiary-fixed": "#e7deff",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ccbdff",
                        "on-secondary-fixed": "#121d25",
                        "tertiary": "#6339db",
                        "surface-container": "#ecedf7",
                        "on-surface-variant": "#414754",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#3d4851",
                        "surface-tint": "#005bbe",
                        "secondary-container": "#d9e4f0",
                        "inverse-primary": "#acc7ff",
                        "on-secondary-container": "#5b6670",
                        "tertiary-container": "#7d56f5",
                        "background": "#f9f9ff",
                        "on-tertiary-fixed": "#1f005f",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary-fixed-variant": "#4d17c5",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#d7e2ff",
                        "on-primary-fixed": "#001a40",
                        "secondary": "#55606a",
                        "surface-container-high": "#e6e8f2",
                        "on-surface": "#181c23",
                        "secondary-fixed-dim": "#bdc8d3",
                        "surface": "#f9f9ff",
                        "inverse-surface": "#2d3038",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed-variant": "#004491",
                        "surface-container-low": "#f2f3fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "card-gap": "12px",
                        "base": "8px",
                        "xl": "32px",
                        "container-padding": "20px",
                        "md": "16px",
                        "xs": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-md-bold": ["Plus Jakarta Sans"],
                        "body-lg-bold": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg-reg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-md-reg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md-bold": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-lg-bold": ["18px", {"lineHeight": "26px", "fontWeight": "700"}],
                        "display-lg": ["36px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-lg-reg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "body-md-reg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-start overflow-hidden">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-padding h-14 w-full z-50 bg-surface dark:bg-surface-dim sticky top-0">
<button aria-label="Go Back" class="flex items-center justify-center w-10 h-10 hover:bg-surface-container-low rounded-full transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-black text-primary">누가낼래</h1>
<div class="font-label-md text-label-md text-primary font-bold bg-primary-fixed px-3 py-1 rounded-full">
            3/3
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md px-container-padding pt-lg pb-32 overflow-y-auto scroll-hide">
<!-- Header Section -->
<section class="mb-xl animate-in fade-in slide-in-from-top-4 duration-700">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">어떻게 나눌까요?</h2>
<p class="font-body-md-reg text-on-surface-variant">원하시는 정산 방식을 선택해 주세요.</p>
</section>
<!-- Settlement Options List -->
<div class="space-y-card-gap flex flex-col">
<!-- Option 1: Equally -->
<div class="bg-surface-container-lowest p-md rounded-[24px] shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border-2 border-transparent transition-all duration-200 active:scale-98 cursor-pointer group hover:border-outline-variant" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[28px]">groups</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg-bold text-on-surface">똑같이 나누기</h3>
<p class="font-label-md text-on-surface-variant">모두 같은 금액을 내요.</p>
</div>
<span class="material-symbols-outlined text-outline-variant group-[.selected-card]:text-primary group-[.selected-card]:fill">circle</span>
</div>
</div>
<!-- Option 2: One Person Exempted (Initially Selected) -->
<div class="bg-surface-container-lowest p-md rounded-[24px] shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border-2 selected-card transition-all duration-200 active:scale-98 cursor-pointer group" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[28px]">person_off</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg-bold text-on-surface">한 명 면제</h3>
<p class="font-label-md text-on-surface-variant">한 명을 뽑고 나머지가 나눠 내요.</p>
</div>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Option 3: One Pays More -->
<div class="bg-surface-container-lowest p-md rounded-[24px] shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border-2 border-transparent transition-all duration-200 active:scale-98 cursor-pointer group hover:border-outline-variant" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[28px]">add_card</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg-bold text-on-surface">한 명 더 내기</h3>
<p class="font-label-md text-on-surface-variant">한 명이 정해진 금액을 조금 더 내요.</p>
</div>
<span class="material-symbols-outlined text-outline-variant group-[.selected-card]:text-primary group-[.selected-card]:fill">circle</span>
</div>
</div>
<!-- Option 4: Differential -->
<div class="bg-surface-container-lowest p-md rounded-[24px] shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border-2 border-transparent transition-all duration-200 active:scale-98 cursor-pointer group hover:border-outline-variant" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-xl bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[28px]">pie_chart</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg-bold text-on-surface">차등 정산</h3>
<p class="font-label-md text-on-surface-variant">각자 다른 비율로 나눠 내요.</p>
</div>
<span class="material-symbols-outlined text-outline-variant group-[.selected-card]:text-primary group-[.selected-card]:fill">circle</span>
</div>
</div>
</div>
<!-- Decorative Info Card (Bento Style) -->
<div class="mt-lg p-md bg-secondary-container rounded-[24px] flex items-start gap-sm">
<span class="material-symbols-outlined text-on-secondary-container">info</span>
<p class="font-label-sm text-on-secondary-container">
                선택한 방식에 따라 정산 결과가 자동으로 계산되어 전송됩니다.
            </p>
</div>
</main>
<!-- Bottom Fixed Button Container -->
<footer class="fixed bottom-0 left-0 w-full z-50 px-container-padding py-6 bg-gradient-to-t from-background via-background to-transparent pointer-events-none">
<div class="max-w-md mx-auto pointer-events-auto">
<button class="w-full h-14 bg-primary text-on-primary font-body-lg-bold rounded-full shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-base">
                결과 확인하기
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<script>
        function selectOption(element) {
            // Remove selection from all cards
            document.querySelectorAll('.bg-surface-container-lowest').forEach(card => {
                card.classList.remove('selected-card');
                const icon = card.querySelector('.material-symbols-outlined:last-child');
                if (icon) {
                    icon.innerHTML = 'circle';
                    icon.style.fontVariationSettings = "'FILL' 0";
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-outline-variant');
                }
            });

            // Add selection to clicked card
            element.classList.add('selected-card');
            const selectedIcon = element.querySelector('.material-symbols-outlined:last-child');
            if (selectedIcon) {
                selectedIcon.innerHTML = 'check_circle';
                selectedIcon.style.fontVariationSettings = "'FILL' 1";
                selectedIcon.classList.remove('text-outline-variant');
                selectedIcon.classList.add('text-primary');
            }
        }

        // Ripple Effect or Interaction feedback could go here
    </script>
</body></html>
