<script>
        // Simple Confetti Animation for Delight
        function createConfetti() {
            const container = document.getElementById('confetti-box');
            const colors = ['#3182F6', '#1071e5', '#acc7ff', '#6339db', '#ccbdff'];
            
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.className = 'confetti-particle';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = '-10%';
                particle.style.opacity = Math.random();
                particle.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                const duration = 2 + Math.random() * 3;
                const delay = Math.random() * 2;
                
                particle.animate([
                    { top: '-10%', transform: `rotate(0deg) translateX(0)` },
                    { top: '110%', transform: `rotate(${360 + Math.random() * 360}deg) translateX(${Math.random() * 40 - 20}px)` }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    iterations: Infinity,
                    easing: 'cubic-bezier(0.37, 0, 0.63, 1)'
                });
                
                container.appendChild(particle);
            }
        }
        
        document.addEventListener('DOMContentLoaded', createConfetti);

        // Micro-interaction for buttons
        document.querySelectorAll('button, a').forEach(btn => {
            btn.addEventListener('click', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });
    </script>
