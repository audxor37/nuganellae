<!DOCTYPE html><html lang="ko" class="light"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#d9e4f0",
                        "primary-fixed-dim": "#acc7ff",
                        "primary-container": "#1071e5",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e0e2ec",
                        "outline": "#727785",
                        "on-background": "#181c23",
                        "primary": "#0059b9",
                        "outline-variant": "#c1c6d6",
                        "inverse-on-surface": "#eff0fa",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d8d9e3",
                        "surface-container-highest": "#e0e2ec",
                        "on-primary-container": "#fefcff",
                        "tertiary-fixed": "#e7deff",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ccbdff",
                        "on-secondary-fixed": "#121d25",
                        "tertiary": "#6339db",
                        "surface-container": "#ecedf7",
                        "on-surface-variant": "#414754",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#3d4851",
                        "surface-tint": "#005bbe",
                        "secondary-container": "#d9e4f0",
                        "inverse-primary": "#acc7ff",
                        "on-secondary-container": "#5b6670",
                        "tertiary-container": "#7d56f5",
                        "background": "#f9f9ff",
                        "on-tertiary-fixed": "#1f005f",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary-fixed-variant": "#4d17c5",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#d7e2ff",
                        "on-primary-fixed": "#001a40",
                        "secondary": "#55606a",
                        "surface-container-high": "#e6e8f2",
                        "on-surface": "#181c23",
                        "secondary-fixed-dim": "#bdc8d3",
                        "surface": "#f9f9ff",
                        "inverse-surface": "#2d3038",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed-variant": "#004491",
                        "surface-container-low": "#f2f3fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "card-gap": "12px",
                        "base": "8px",
                        "xl": "32px",
                        "container-padding": "20px",
                        "md": "16px",
                        "xs": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-md-bold": ["Plus Jakarta Sans"],
                        "body-lg-bold": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg-reg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-md-reg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md-bold": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-lg-bold": ["18px", {"lineHeight": "26px", "fontWeight": "700"}],
                        "display-lg": ["36px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-lg-reg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "body-md-reg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .active-scale:active { transform: scale(0.95); }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .roulette-spin { animation: spin 20s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">

    <!-- TopAppBar -->
    <header class="flex justify-between items-center px-container-padding h-14 w-full z-50 bg-surface dark:bg-surface-dim sticky top-0">
        <button class="w-10 h-10 flex items-center justify-start text-primary active-scale">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <h1 class="font-headline-md text-headline-md font-bold text-on-surface">면제 정산 설정</h1>
        <div class="w-10 flex items-center justify-end">
            <span class="font-label-md text-label-md text-primary font-bold">1/3</span>
        </div>
    </header>

    <main class="flex-1 px-container-padding pt-lg pb-xl space-y-lg overflow-y-auto">
        <!-- Headline Section -->
        <div class="space-y-xs">
            <h2 class="font-headline-lg text-headline-lg text-on-surface">면제 정산을 설정해 주세요</h2>
            <p class="font-body-md-reg text-body-md-reg text-on-surface-variant">한 명을 무작위로 선택하고, 나머지 인원이 금액을 나눠 냅니다.</p>
        </div>

        <!-- Summary Area: Bento Style -->
        <div class="grid grid-cols-2 gap-card-gap">
            <div class="col-span-2 p-lg bg-surface-container-lowest rounded-3xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] flex items-center justify-between border border-outline-variant/30">
                <div class="space-y-1">
                    <p class="font-label-sm text-label-sm text-on-surface-variant">총 정산 금액</p>
                    <p class="font-headline-lg text-headline-lg text-primary">84,000원</p>
                </div>
                <div class="h-12 w-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
                </div>
            </div>
            
            <div class="p-md bg-surface-container-lowest rounded-3xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] space-y-base border border-outline-variant/30">
                <p class="font-label-sm text-label-sm text-on-surface-variant">참여자</p>
                <div class="flex items-center space-x-2">
                    <span class="font-headline-md text-headline-md text-on-surface">4명</span>
                    <div class="flex -space-x-2">
                        <div class="w-6 h-6 rounded-full border-2 border-surface bg-secondary-container"></div>
                        <div class="w-6 h-6 rounded-full border-2 border-surface bg-tertiary-container"></div>
                        <div class="w-6 h-6 rounded-full border-2 border-surface bg-primary-container"></div>
                    </div>
                </div>
            </div>

            <div class="p-md bg-surface-container-lowest rounded-3xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] space-y-base border border-outline-variant/30">
                <p class="font-label-sm text-label-sm text-on-surface-variant">면제 방식</p>
                <div class="flex items-center space-x-2">
                    <span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">casino</span>
                    <span class="font-body-md-bold text-body-md-bold text-on-surface">랜덤 1명</span>
                </div>
            </div>
        </div>

        <!-- Visual Roulette Decor -->
        <div class="relative py-xl flex justify-center overflow-hidden">
            <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
                <div class="w-64 h-64 border-[12px] border-dashed border-primary rounded-full roulette-spin"></div>
            </div>
            <div class="relative z-10 w-48 h-48 bg-surface-container-highest rounded-full shadow-inner flex items-center justify-center border-4 border-surface overflow-hidden">
                 <div class="grid grid-cols-2 grid-rows-2 w-full h-full rotate-45">
                    <div class="bg-primary/20 border border-surface/50 flex items-center justify-center -rotate-45">
                        <span class="material-symbols-outlined text-primary-container">person</span>
                    </div>
                    <div class="bg-tertiary/20 border border-surface/50 flex items-center justify-center -rotate-45">
                        <span class="material-symbols-outlined text-tertiary-container">person</span>
                    </div>
                    <div class="bg-secondary/20 border border-surface/50 flex items-center justify-center -rotate-45">
                        <span class="material-symbols-outlined text-on-secondary-container">person</span>
                    </div>
                    <div class="bg-primary/40 border border-surface/50 flex items-center justify-center -rotate-45 relative overflow-hidden">
                        <span class="material-symbols-outlined text-primary font-bold">check_circle</span>
                        <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
                    </div>
                 </div>
                 <div class="absolute w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center z-20">
                    <span class="material-symbols-outlined text-primary">auto_awesome</span>
                 </div>
            </div>
        </div>

        <!-- Option: Toggle -->
        <div class="bg-surface-container-lowest rounded-3xl p-lg flex items-center justify-between border border-outline-variant/30">
            <div class="space-y-0.5">
                <p class="font-body-md-bold text-body-md-bold text-on-surface">결과 재선택 허용</p>
                <p class="font-label-sm text-label-sm text-on-surface-variant">결과가 마음에 안 들면 다시 돌릴 수 있어요.</p>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" value="" class="sr-only peer" checked="">
                <div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
            </label>
        </div>

        <!-- Result Preview -->
        <div class="bg-primary-fixed/20 border border-primary-fixed rounded-3xl p-lg space-y-md">
            <div class="flex items-center space-x-2 text-primary">
                <span class="material-symbols-outlined font-bold">analytics</span>
                <p class="font-body-md-bold text-body-md-bold">예상 결과 미리보기</p>
            </div>
            <div class="flex justify-between items-end">
                <div class="space-y-1">
                    <p class="font-label-sm text-label-sm text-on-surface-variant">면제 1명</p>
                    <p class="font-headline-md text-headline-md text-on-surface">0원</p>
                </div>
                <div class="h-8 w-px bg-outline-variant/30 self-center"></div>
                <div class="space-y-1 text-right">
                    <p class="font-label-sm text-label-sm text-on-surface-variant">나머지 3명 (각)</p>
                    <p class="font-headline-md text-headline-md text-on-surface">약 28,000원</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Action Button -->
    <footer class="p-container-padding bg-surface/80 backdrop-blur-md pb-safe">
        <button class="w-full h-14 bg-primary text-on-primary rounded-2xl font-body-lg-bold text-body-lg-bold flex items-center justify-center space-x-2 active-scale transition-all shadow-lg shadow-primary/20"><span class="material-symbols-outlined">play_arrow</span><span class="">게임 선택하기</span></button>
    </footer>

    <!-- BottomNavBar (Optional Suppression applied as per Task - this is a sub-page/task-focused screen) -->
    
    <script>
        // Micro-interaction for toggle
        document.querySelector('input[type="checkbox"]').addEventListener('change', function(e) {
            const previewCard = document.querySelector('.bg-primary-fixed\\/20');
            if(e.target.checked) {
                previewCard.style.opacity = '1';
                previewCard.style.transform = 'translateY(0px)';
            } else {
                previewCard.style.opacity = '0.8';
                previewCard.style.transform = 'translateY(4px)';
            }
        });
    </script>



</body></html>
