                        "on-surface-variant": "#414754",

                        "on-secondary-fixed-variant": "#3d4851",
                        "surface-tint": "#005bbe",
                        "secondary-container": "#d9e4f0",
                        "inverse-primary": "#acc7ff",

                        "tertiary-container": "#7d56f5",

<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-container-padding h-14 w-full z-50 bg-surface fixed top-0 left-0">
<button class="w-10 h-10 flex items-center justify-start text-on-surface transition-transform active:scale-90">
<span class="material-symbols-outlined text-[28px]">arrow_back</span>
</button>
<h1 class="font-bold text-headline-md tracking-tight">누가낼래</h1>
<div class="w-10 h-10 flex items-center justify-end text-primary font-bold">
            1/3
        </div>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-[428px] px-container-padding pt-24 pb-32 flex flex-col items-center text-center">
<!-- Header Text -->
<section class="mb-12">
<h2 class="text-on-background font-bold text-[28px] leading-tight mb-2">오늘의 정산 결과는?</h2>
<p class="text-on-surface-variant text-body-md-reg">버튼을 눌러 결과를 확인해 보세요.</p>
</section>
<!-- Roulette Section -->
<div class="relative w-full aspect-square max-w-[320px] flex items-center justify-center mb-8">
<!-- Pin Pointer -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-2 z-20">
<svg fill="none" height="48" viewbox="0 0 40 48" width="40" xmlns="http://www.w3.org/2000/svg">
<path d="M20 48L37.3205 18L2.67949 18L20 48Z" fill="#3182F6"></path>
<circle cx="20" cy="14" fill="#3182F6" r="10"></circle>
</svg>
</div>
<!-- The Wheel -->
<div class="w-full h-full rounded-full border-8 border-white bg-white roulette-shadow overflow-hidden relative" id="roulette-wrapper">
<div class="w-full h-full relative origin-center" id="roulette-container">
<!-- Segment 1: 민수 (Pastel Blue) -->
<div class="absolute inset-0 origin-center" style="clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 50%); background-color: #E8F3FF;"></div>
<div class="absolute top-[15%] left-1/2 -translate-x-1/2 rotate-[45deg] origin-[bottom_center] h-[35%] flex items-start justify-center">
<span class="text-primary font-bold text-body-lg-bold transform -rotate-[45deg] mt-6">민수</span>
</div>
<!-- Segment 2: 지훈 (Pastel Green) -->
<div class="absolute inset-0 origin-center rotate-90" style="clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 50%); background-color: #E7F9F1;"></div>
<div class="absolute top-[15%] left-1/2 -translate-x-1/2 rotate-[135deg] origin-[bottom_center] h-[35%] flex items-start justify-center">
<span class="text-[#00B46A] font-bold text-body-lg-bold transform -rotate-[135deg] mt-6">지훈</span>
</div>
<!-- Segment 3: 수진 (Pastel Purple) -->
<div class="absolute inset-0 origin-center rotate-180" style="clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 50%); background-color: #F3EFFF;"></div>
<div class="absolute top-[15%] left-1/2 -translate-x-1/2 rotate-[225deg] origin-[bottom_center] h-[35%] flex items-start justify-center">
<span class="text-[#6339DB] font-bold text-body-lg-bold transform -rotate-[225deg] mt-6">수진</span>
</div>
<!-- Segment 4: 영희 (Pastel Red/Orange) -->
<div class="absolute inset-0 origin-center rotate-[270deg]" style="clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 50%); background-color: #FFF2E8;"></div>
<div class="absolute top-[15%] left-1/2 -translate-x-1/2 rotate-[315deg] origin-[bottom_center] h-[35%] flex items-start justify-center">
<span class="text-[#FF8438] font-bold text-body-lg-bold transform -rotate-[315deg] mt-6">영희</span>
</div>
<!-- Center Cap -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 bg-white rounded-full shadow-sm z-10 flex items-center justify-center">
<div class="w-3 h-3 bg-primary rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- Participants Quick Info Card -->
<div class="w-full bg-white rounded-2xl p-5 roulette-shadow flex items-center justify-between">
<div class="flex flex-col items-start">
<span class="text-label-sm text-on-surface-variant mb-1">총 결제 금액</span>
<span class="text-headline-md font-bold text-on-surface">54,000원</span>
</div>
<div class="flex -space-x-2">
<div class="w-8 h-8 rounded-full border-2 border-white bg-primary-fixed flex items-center justify-center text-on-primary-fixed text-[10px] font-bold">민</div>
<div class="w-8 h-8 rounded-full border-2 border-white bg-tertiary-fixed flex items-center justify-center text-on-tertiary-fixed text-[10px] font-bold">지</div>
<div class="w-8 h-8 rounded-full border-2 border-white bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed text-[10px] font-bold">수</div>
<div class="w-8 h-8 rounded-full border-2 border-white bg-error-container flex items-center justify-center text-on-error-container text-[10px] font-bold">영</div>
</div>
</div>
</main>
<!-- Bottom Action Button -->
<footer class="fixed bottom-0 left-0 w-full p-container-padding bg-surface/80 backdrop-blur-md z-50">
<div class="max-w-[428px] mx-auto">
<button class="w-full h-14 bg-primary text-white rounded-xl font-bold text-body-lg-bold active-scale transition-all flex items-center justify-center gap-2" id="spin-button">
<span class="material-symbols-outlined">refresh</span>
                룰렛 돌리기
            </button>
</div>
</footer>
<!-- Bottom Navigation (Shared Component Placeholder) -->
<nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container-lowest hidden">
<!-- Hidden as per task focusing on the roulette screen specific journey -->
</nav>
<script>
        const spinButton = document.getElementById('spin-button');
        const roulette = document.getElementById('roulette-container');
        let currentRotation = 0;
        let isSpinning = false;

        spinButton.addEventListener('click', () => {
            if (isSpinning) return;

            isSpinning = true;
            spinButton.disabled = true;
            spinButton.classList.add('opacity-50');
            spinButton.innerText = '행운을 빌어요...';

            // Random rotation between 5 and 10 full turns + random segment
            const extraDegrees = Math.floor(Math.random() * 360);
            const totalSpins = (5 + Math.floor(Math.random() * 5)) * 360;
            currentRotation += totalSpins + extraDegrees;

            roulette.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinButton.disabled = false;
                spinButton.classList.remove('opacity-50');
                spinButton.innerHTML = '<span class="material-symbols-outlined">refresh</span> 다시 돌리기';
                
                // Determin result (Simplified logic for UI feedback)
                const finalDeg = currentRotation % 360;
                let winner = "";
                // Note: Pin is at the top (0deg). Rotation is clockwise.
                // 0-90: Segment 4 (Orange - 영희)
                // 90-180: Segment 3 (Purple - 수진)
                // 180-270: Segment 2 (Green - 지훈)
                // 270-360: Segment 1 (Blue - 민수)
                
                // Correction for pin alignment
                const normalized = (360 - finalDeg) % 360;
                if (normalized >= 0 && normalized < 90) winner = "민수";
                else if (normalized >= 90 && normalized < 180) winner = "영희";
                else if (normalized >= 180 && normalized < 270) winner = "수진";
                else winner = "지훈";

                // Success micro-interaction
                showResultOverlay(winner);
            }, 5000);
        });

        function showResultOverlay(name) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 z-[60] flex items-center justify-center bg-black/40 backdrop-blur-sm animate-in fade-in duration-300';
            overlay.innerHTML = `
                <div class="bg-white rounded-2xl p-8 max-w-[300px] w-full text-center shadow-2xl scale-in-center animate-in zoom-in-95 duration-200">
                    <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">celebration</span>
                    </div>
                    <h3 class="text-headline-md font-bold text-on-surface mb-2">당첨자 발표!</h3>
                    <p class="text-body-lg-reg text-on-surface-variant mb-6">오늘의 주인공은 <br><span class="text-primary font-black text-headline-lg">${name}</span>님입니다!</p>
                    <button onclick="this.parentElement.parentElement.remove()" class="w-full py-3 bg-primary text-white rounded-xl font-bold">확인</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }
    </script>
</body></html>
