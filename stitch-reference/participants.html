<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed": "#d9e4f0",
                    "primary-fixed-dim": "#acc7ff",
                    "primary-container": "#1071e5",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "surface-variant": "#e0e2ec",
                    "outline": "#727785",
                    "on-background": "#181c23",
                    "primary": "#0059b9",
                    "outline-variant": "#c1c6d6",
                    "inverse-on-surface": "#eff0fa",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#d8d9e3",
                    "surface-container-highest": "#e0e2ec",
                    "on-primary-container": "#fefcff",
                    "tertiary-fixed": "#e7deff",
                    "on-error-container": "#93000a",
                    "on-error": "#ffffff",
                    "tertiary-fixed-dim": "#ccbdff",
                    "on-secondary-fixed": "#121d25",
                    "tertiary": "#6339db",
                    "surface-container": "#ecedf7",
                    "on-surface-variant": "#414754",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#3d4851",
                    "surface-tint": "#005bbe",
                    "secondary-container": "#d9e4f0",
                    "inverse-primary": "#acc7ff",
                    "on-secondary-container": "#5b6670",
                    "tertiary-container": "#7d56f5",
                    "background": "#f9f9ff",
                    "on-tertiary-fixed": "#1f005f",
                    "surface-bright": "#f9f9ff",
                    "on-tertiary-fixed-variant": "#4d17c5",
                    "error-container": "#ffdad6",
                    "primary-fixed": "#d7e2ff",
                    "on-primary-fixed": "#001a40",
                    "secondary": "#55606a",
                    "surface-container-high": "#e6e8f2",
                    "on-surface": "#181c23",
                    "secondary-fixed-dim": "#bdc8d3",
                    "surface": "#f9f9ff",
                    "inverse-surface": "#2d3038",
                    "on-tertiary-container": "#fffbff",
                    "on-primary-fixed-variant": "#004491",
                    "surface-container-low": "#f2f3fd"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "12px",
                    "card-gap": "12px",
                    "base": "8px",
                    "xl": "32px",
                    "container-padding": "20px",
                    "md": "16px",
                    "xs": "4px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "body-md-bold": ["Plus Jakarta Sans"],
                    "body-lg-bold": ["Plus Jakarta Sans"],
                    "display-lg": ["Plus Jakarta Sans"],
                    "label-md": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "body-lg-reg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "label-sm": ["Plus Jakarta Sans"],
                    "body-md-reg": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "body-md-bold": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "body-lg-bold": ["18px", {"lineHeight": "26px", "fontWeight": "700"}],
                    "display-lg": ["36px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-lg-reg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "body-md-reg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f9f9ff;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .animate-pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-padding h-14 w-full z-50 bg-surface dark:bg-surface-dim sticky top-0">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md text-primary font-black">누가낼래</span>
<span class="font-label-md text-label-md text-on-surface-variant font-bold px-3 py-1 bg-surface-container-high rounded-full">2/3</span>
</header>
<main class="flex-1 px-container-padding pt-lg pb-32">
<!-- Headline Section -->
<div class="mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">누가 함께했나요?</h1>
<p class="font-body-md-reg text-body-md-reg text-on-surface-variant">정산에 참여할 멤버들을 추가해주세요.</p>
</div>
<!-- Input Section -->
<div class="relative mb-lg group">
<div class="flex items-center bg-surface-container-low rounded-xl border-2 border-transparent focus-within:border-primary focus-within:bg-surface transition-all duration-300 px-md py-xs">
<span class="material-symbols-outlined text-outline mr-sm" data-icon="person_add">person_add</span>
<input class="flex-1 bg-transparent border-none focus:ring-0 font-body-md-reg text-body-md-reg py-3 placeholder:text-outline-variant" placeholder="이름을 입력하세요" type="text"/>
<button class="bg-primary text-on-primary w-10 h-10 rounded-lg flex items-center justify-center shadow-md active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Counter & List Header -->
<div class="flex justify-between items-center mb-md">
<div class="flex items-center gap-xs">
<span class="font-body-md-bold text-body-md-bold text-on-surface">참여자 목록</span>
<span class="bg-primary-container/10 text-primary-container px-2 py-0.5 rounded-full font-label-sm text-label-sm">총 4명</span>
</div>
<button class="text-primary font-label-md text-label-md">전체 삭제</button>
</div>
<!-- Participant List (Bento-ish Grid layout) -->
<div class="grid grid-cols-2 gap-card-gap">
<!-- Member: 민수 -->
<div class="animate-pop-in bg-white p-4 rounded-2xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] flex justify-between items-center border border-surface-container-high">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="text-primary font-bold">민</span>
</div>
<span class="font-body-md-bold text-body-md-bold">민수</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-outline-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="close">close</span>
</button>
</div>
<!-- Member: 지훈 -->
<div class="animate-pop-in bg-white p-4 rounded-2xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] flex justify-between items-center border border-surface-container-high" style="animation-delay: 0.1s;">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-tertiary-fixed flex items-center justify-center">
<span class="text-tertiary font-bold">지</span>
</div>
<span class="font-body-md-bold text-body-md-bold">지훈</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-outline-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="close">close</span>
</button>
</div>
<!-- Member: 수진 -->
<div class="animate-pop-in bg-white p-4 rounded-2xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] flex justify-between items-center border border-surface-container-high" style="animation-delay: 0.2s;">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="text-on-primary-fixed-variant font-bold">수</span>
</div>
<span class="font-body-md-bold text-body-md-bold">수진</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-outline-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="close">close</span>
</button>
</div>
<!-- Member: 영희 -->
<div class="animate-pop-in bg-white p-4 rounded-2xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] flex justify-between items-center border border-surface-container-high" style="animation-delay: 0.3s;">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-secondary-fixed flex items-center justify-center">
<span class="text-on-secondary-fixed-variant font-bold">영</span>
</div>
<span class="font-body-md-bold text-body-md-bold">영희</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-outline-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-xl" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Tip card -->
<div class="mt-lg bg-surface-container p-md rounded-2xl flex gap-md items-start">
<span class="material-symbols-outlined text-primary-container" data-icon="lightbulb">lightbulb</span>
<p class="font-label-md text-label-md text-on-surface-variant">자주 함께하는 친구들을 '즐겨찾기'에서 불러올 수 있습니다.</p>
</div>
</main>
<!-- Fixed Bottom Button Section -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-gradient-to-t from-background via-background to-transparent pt-10">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-body-lg-bold text-body-lg-bold flex items-center justify-center gap-base shadow-lg shadow-primary/20 active:scale-98 transition-all">
            정산 방식 고르기
            <span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Background Decorative Element (Shader simulation) -->
<div class="fixed top-0 left-0 -z-10 w-full h-full opacity-30 pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[300px] h-[300px] rounded-full bg-primary-container/20 blur-3xl"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[250px] h-[250px] rounded-full bg-tertiary-container/10 blur-3xl"></div>
</div>
<script>
        // Simple Interaction logic
        document.querySelectorAll('.animate-pop-in button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const card = e.currentTarget.closest('.animate-pop-in');
                card.style.transform = 'scale(0.9)';
                card.style.opacity = '0';
                setTimeout(() => {
                    card.style.display = 'none';
                }, 300);
            });
        });
    </script>
</body></html>
