<!DOCTYPE html>

<style>
        body {
            font-family: 'Noto Sans KR', 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .floating-anim {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(49, 130, 246, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-padding h-14 w-full z-50 bg-surface fixed top-0 docked full-width">
<div class="font-headline-lg text-headline-lg font-black text-primary">누가낼래</div>
<div class="flex items-center gap-2">
<span class="font-label-md text-label-md text-primary">1/3</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-14 mb-20 px-container-padding flex flex-col items-center relative overflow-hidden">
<div class="blob -top-20 -left-20"></div>
<div class="blob -bottom-20 -right-20"></div>
<!-- Headline & Hero Section -->
<section class="mt-8 text-center w-full animate-fade-in-up">
<h1 class="font-display-lg text-display-lg text-on-background mb-4">
                오늘 정산,<br/><span class="text-primary">재미있게 결정해요</span>
</h1>
<p class="font-body-md-reg text-body-md-reg text-on-surface-variant max-w-[280px] mx-auto">
                금액과 참여자를 입력하면 각자 낼 금액을 계산해 드려요.
            </p>
</section>
<!-- Illustration Area -->
<section class="flex-1 flex flex-col justify-center items-center w-full my-8">
<div class="relative w-64 h-64 flex justify-center items-center floating-anim">
<!-- Main Card Illustration Mockup using CSS & Textures -->
<div class="w-48 h-64 bg-white rounded-[24px] shadow-[0px_20px_50px_rgba(0,0,0,0.08)] flex flex-col p-6 rotate-[-5deg] border border-surface-variant z-10">
<div class="w-10 h-10 rounded-full bg-primary-fixed mb-4 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<div class="h-2 w-24 bg-surface-container-high rounded-full mb-2"></div>
<div class="h-2 w-16 bg-surface-container-high rounded-full mb-8"></div>
<div class="mt-auto flex justify-between items-end">
<div class="font-body-lg-bold text-body-lg-bold text-primary">₩ 15,000</div>
<div class="flex -space-x-2">
<div class="w-6 h-6 rounded-full border-2 border-white bg-secondary-fixed"></div>
<div class="w-6 h-6 rounded-full border-2 border-white bg-tertiary-fixed"></div>
</div>
</div>
</div>
<!-- Secondary decorative card -->
<div class="absolute w-44 h-56 bg-secondary-container opacity-50 rounded-[20px] rotate-[10deg] -z-10 translate-x-12 translate-y-4"></div>
</div>
</section>
<!-- Recent Transaction Card -->
<section class="w-full mb-8">
<div class="bg-white rounded-xl p-4 flex items-center justify-between shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-surface-container">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">history</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-outline">최근 정산 (7월 14일)</p>
<p class="font-body-md-bold text-body-md-bold text-on-surface">강남역 삼겹살 모임</p>
</div>
</div>
<div class="text-right">
<p class="font-body-md-bold text-body-md-bold text-primary">84,000원</p>
</div>
</div>
</section>
<!-- CTA Button -->
<section class="w-full pb-8">
<button class="w-full h-14 bg-primary text-on-primary font-body-lg-bold text-body-lg-bold rounded-xl shadow-lg active:scale-95 transition-transform duration-200 flex items-center justify-center gap-2">
                정산 시작하기
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container-lowest shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] rounded-t-xl">
<!-- Destination: 정산하기 (Active) -->
<a class="flex flex-col items-center justify-center text-primary bg-secondary-container rounded-full px-4 py-1 scale-98 transition-all duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-sm text-label-sm mt-0.5">정산하기</span>
</a>
<!-- Destination: 정산 내역 -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-full px-4 py-1 transition-all" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-sm text-label-sm mt-0.5">정산 내역</span>
</a>
<!-- Destination: 설정 -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-full px-4 py-1 transition-all" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm mt-0.5">설정</span>
</a>
</nav>
<script>
        // Simple Interaction logic
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', (e) => {
                if(link.getAttribute('href') === '#') e.preventDefault();
            });
        });

        // Entrance animation logic
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.animate-fade-in-up');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'all 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
                el.style.transitionDelay = `${index * 0.1}s`;
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100);
            });
        });
    </script>
</body></html>
